<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ラーメン帳">
<meta name="theme-color" content="#fff6e9">
<title>ラーメン帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Eureka! と同じ世界観：生成りのドット背景、ぷっくりした立体ボタン、丸ゴシック */
:root{
  /* テーマカラー：L はライト、D はダーク用。下の data-color で色ごとに入れ替える */
  --acL:#e07b22; --acL-deep:#a8561a; --acL-text:#b8621a; --acL-weak:#fdebe1; --acD:#f39a3d; --acD-deep:#a85a10; --acD-text:#f39a3d;
  --bg:#fff6e9; --bg-dot:#f7e4c9; --surface:#fff; --text:#2d3246; --ink2:#4a4c5c; --muted:#867868; --faint:#bcae9e;
  --line:#f1dfc6; --edge:#ecd2ae;
  --accent:var(--acL); --accent-deep:var(--acL-deep); --on-accent:#fff; --accent-weak:var(--acL-weak); --accent-text:var(--acL-text);
  --negi:#6fa35f; --negi-deep:#4c7a40; --naruto:#f3a5b2; --cand:#a59a8c; --track:#f6e6cf; --bubble:#fff;
  --tab-h:66px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --out-cubic:cubic-bezier(.33,1,.68,1); --out-back:cubic-bezier(.34,1.56,.64,1); --inout-sine:cubic-bezier(.37,0,.63,1);
}
:root[data-color="shoyu"]{--acL:#8a5a3b; --acL-deep:#5e3a24; --acL-text:#7a4a2e; --acL-weak:#f1e4da; --acD:#d6a57f; --acD-deep:#7a5038; --acD-text:#deb08c}
:root[data-color="shio"]{--acL:#2f86b0; --acL-deep:#1f5f80; --acL-text:#236f96; --acL-weak:#e3f0f6; --acD:#6fb9db; --acD-deep:#2a6582; --acD-text:#86c6e4}
:root[data-color="naruto"]{--acL:#d9607a; --acL-deep:#a23e55; --acL-text:#b8455f; --acL-weak:#fbe6eb; --acD:#f39aaf; --acD-deep:#a84a5e; --acD-text:#f5a8ba}
:root[data-color="negi"]{--acL:#5a9a48; --acL-deep:#3c6d2f; --acL-text:#477d38; --acL-weak:#e8f2e1; --acD:#8cc77a; --acD-deep:#3f6634; --acD-text:#95cf83}
/* ダーク：メニューで「ダーク」を選んだとき、または「自動」で iPhone がダークモードのとき */
:root[data-theme="dark"]{--bg:#1d2030; --bg-dot:#262a3d; --surface:#2a2e43; --text:#fdf3e6; --ink2:#e3d9cc; --muted:#b9ab9b; --faint:#7f7b88;
    --line:#3a3f58; --edge:#12141e; --accent:var(--acD); --accent-deep:var(--acD-deep); --on-accent:#1d2030; --accent-weak:#353a52; --accent-text:var(--acD-text);
    --negi:#7fb36e; --negi-deep:#3f6634; --cand:#8d8494; --track:#353a52; --bubble:#353a54;}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1d2030; --bg-dot:#262a3d; --surface:#2a2e43; --text:#fdf3e6; --ink2:#e3d9cc; --muted:#b9ab9b; --faint:#7f7b88;
    --line:#3a3f58; --edge:#12141e; --accent:var(--acD); --accent-deep:var(--acD-deep); --on-accent:#1d2030; --accent-weak:#353a52; --accent-text:var(--acD-text);
    --negi:#7fb36e; --negi-deep:#3f6634; --cand:#8d8494; --track:#353a52; --bubble:#353a54;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;font-weight:500;font-size:16px;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;font-weight:500;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:11px 14px;width:100%;
  box-shadow:0 3px 0 var(--edge);outline:none;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--faint)}
textarea{min-height:96px;resize:vertical}
.hidden{display:none!important}
.num{font-family:Fredoka,"Zen Maru Gothic",sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
.i{width:1.2em;height:1.2em;fill:currentColor;flex:none}

/* ぷっくりした立体ボタン：押すと沈む */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:16px;padding:11px 16px;min-height:48px;
  background:var(--accent);color:var(--on-accent);font-weight:700;white-space:nowrap;box-shadow:0 4px 0 var(--accent-deep);
  transition:transform .12s var(--out-cubic),box-shadow .12s var(--out-cubic)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.btn.sub{background:var(--surface);color:var(--text);border:2px solid var(--line);box-shadow:0 4px 0 var(--edge)}
.btn.sub:active{box-shadow:0 1px 0 var(--edge)}
.btn.danger{background:var(--surface);color:var(--accent-text);border:2px dashed var(--accent);box-shadow:none}
.btn.block{width:100%}
.round{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface);box-shadow:0 3px 0 var(--edge);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;flex:none;padding:0;transition:transform .12s var(--out-cubic),box-shadow .12s}
.round:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.round .i{width:22px;height:22px}

/* 画面 */
.view{position:fixed;left:0;right:0;top:0;bottom:calc(var(--tab-h) + var(--safe-b))}
#map{position:absolute;inset:0;background:var(--bg)}

/* 下のタブ：選んでいる方がぷっくり浮く */
.tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + var(--safe-b));padding:8px 14px var(--safe-b);
  display:flex;gap:10px;background:var(--surface);border-top:2px solid var(--line);z-index:1000}
.tabbar button{flex:1;border:0;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-size:11px;font-weight:700;color:var(--muted);height:50px;transition:background .2s,transform .12s var(--out-cubic)}
.tabbar button .i{width:24px;height:24px}
.tabbar button .i.f,.tabbar button.active .i.r{display:none}
.tabbar button.active .i.f{display:block}
.tabbar button.active{color:var(--accent-text);background:var(--accent-weak)}
.tabbar button:active{transform:scale(.94)}

/* マップの上の部品 */
.searchbar{position:absolute;z-index:500;left:12px;right:12px;top:calc(var(--safe-t) + 10px);display:flex;gap:8px}
.searchbar input{border-color:var(--line)}
.results{position:absolute;z-index:510;left:12px;right:12px;top:calc(var(--safe-t) + 70px);max-height:50%;overflow:auto;
  background:var(--surface);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--edge)}
.results .item{padding:12px 16px;border-bottom:2px dashed var(--line)}
.results .item:last-of-type{border-bottom:0}
.results .item b{display:block;font-weight:700}
.results .item small{color:var(--muted)}
.results .foot{padding:10px 14px;display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);border-top:2px solid var(--line)}
.results .foot .btn{min-height:40px;padding:6px 14px}
.fabs{position:absolute;z-index:500;right:12px;bottom:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
.fab{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:99px;padding:11px 18px;background:var(--surface);color:var(--text);
  box-shadow:0 4px 0 var(--edge);font-weight:700;font-size:14px;transition:transform .12s var(--out-cubic),box-shadow .12s}
.fab:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.fab.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 4px 0 var(--accent-deep)}
.fab.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + var(--safe-b) + 84px);z-index:3000;
  background:var(--text);color:var(--bg);padding:11px 18px;border-radius:16px;font-size:14px;font-weight:700;max-width:86%;text-align:center;animation:toast-in .45s var(--out-back)}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}

/* 地図のピン */
.pin{position:relative;display:flex;align-items:center;justify-content:center;border-radius:50%}
.pin.visited{width:42px;height:42px;background:#fdebe1 url(face.svg) center 55%/32px no-repeat;border:3px solid var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.pin.cand{width:28px;height:28px;background:var(--cand);color:#fff;border:2px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.pin.cand .i{width:15px;height:15px}
.pin .cnt{position:absolute;right:-8px;top:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--accent);color:#fff;
  font:600 12px/20px Fredoka,sans-serif;text-align:center;border:2px solid #fff}
.leaflet-container{font-family:inherit}
.leaflet-popup-content-wrapper{border-radius:18px;border:2px solid var(--line);box-shadow:0 4px 0 var(--edge);background:var(--surface);color:var(--text)}
.leaflet-popup-tip{background:var(--surface)}
.leaflet-popup-content{margin:14px 16px;font-size:14px;min-width:190px;line-height:1.6}
.leaflet-popup-content b{font-size:16px;font-weight:700}
.leaflet-popup-content .btn{margin-top:10px;width:100%;min-height:42px;padding:8px}
.pop-addr{color:var(--muted);font-size:12px;margin-top:2px}

/* ───── 来訪履歴 ───── */
#listView{overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--safe-t) + 14px) 16px 28px;
  background-image:radial-gradient(var(--bg-dot) 1.6px,transparent 1.8px);background-size:22px 22px}
.lv{max-width:620px;margin:0 auto}
.hero{display:flex;align-items:flex-end;gap:10px}
.logo{font-weight:700;font-size:34px;letter-spacing:1px;line-height:1.1;color:var(--accent);text-shadow:0 3px 0 var(--accent-deep);margin:4px 0 2px}
.logo .cho{display:inline-block;color:var(--negi);text-shadow:0 3px 0 var(--negi-deep);transform-origin:50% 90%;animation:cho 3.8s var(--out-cubic) infinite}
@keyframes cho{0%,70%,100%{transform:none}78%{transform:translateY(-7px) rotate(-8deg)}86%{transform:translateY(0) scale(1.1,.9)}92%{transform:translateY(-2px)}}
.tagline{color:var(--muted);font-size:13px;font-weight:700}
.hero-mascot{width:84px;height:98px;flex:none;margin-left:auto;cursor:pointer}
.chara{display:block}
.chara svg{display:block;width:100%;height:100%;overflow:visible}
.hero-talk{display:flex;justify-content:flex-end;margin:6px 0 14px}
.bubble{position:relative;background:var(--bubble);border:2px solid var(--line);border-radius:16px;padding:7px 14px;font-weight:700;font-size:14px;
  box-shadow:0 3px 0 var(--edge);line-height:1.5;max-width:80%}
.bubble::after{content:"";position:absolute;right:30px;top:-8px;width:12px;height:12px;background:var(--bubble);border:2px solid var(--line);
  border-right:0;border-bottom:0;transform:rotate(45deg)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 6px 9px;text-align:center;box-shadow:0 4px 0 var(--edge)}
.stat b{display:block;font-size:28px;line-height:1.15;color:var(--text)}
.stat b small{font-size:13px;color:var(--muted);margin-left:2px}
.stat>span{font-size:12px;color:var(--muted);font-weight:700}
.stat.hot b{color:var(--accent-text)}
.sec-h{display:flex;align-items:center;gap:8px;margin:26px 4px 10px;font-size:14px;font-weight:700;color:var(--muted)}
.sec-h .grow{flex:1}
.search{position:relative}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--faint)}
.search input{padding-left:42px}
.seg{display:flex;gap:8px;margin:12px 0 16px;flex-wrap:wrap}
.pill{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font-size:14px;font-weight:700;min-height:40px;
  display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 var(--edge);color:var(--ink2);transition:transform .12s var(--out-cubic),box-shadow .12s,background .2s}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 3px 0 var(--accent-deep)}
.cards{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 5px 0 var(--edge);
  display:flex;flex-direction:column;cursor:pointer;transition:transform .12s var(--out-cubic),box-shadow .12s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--edge)}
.card .thumb{position:relative;aspect-ratio:16/10;border-radius:15px;background:var(--accent-weak) center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .thumb.none{background-image:radial-gradient(var(--line) 1.6px,transparent 1.8px);background-size:16px 16px;background-color:var(--accent-weak)}
.thumb-mascot{height:104px;width:auto;image-rendering:pixelated}
.card .bowls{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;background:var(--surface);color:var(--accent-text);
  border-radius:99px;padding:2px 10px 2px 7px;font-weight:700;font-size:13px;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.card .bowls .i{width:16px;height:16px}
.card .bowls .num{font-size:16px}
.card .rank{position:absolute;right:8px;top:8px;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;color:#fff;background:var(--negi);box-shadow:0 2px 0 var(--negi-deep)}
.card .rank.gold{background:var(--accent);box-shadow:0 2px 0 var(--accent-deep)}
.card .body{padding:12px 6px 4px}
.card .name{font-weight:700;font-size:18px;line-height:1.4}
.card .area{color:var(--muted);font-size:12px;margin-top:2px}
.card .meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 10px;border-radius:99px;background:var(--accent-weak);color:var(--accent-text);font-weight:700}
.chip.gray{background:var(--track);color:var(--muted)}
.card .dish,.visit .vd{display:flex;align-items:flex-start;gap:6px}
.card .dish .i,.visit .vd .i{margin-top:3px;color:var(--accent)}
.card .dish{margin-top:9px;font-size:15px;font-weight:700}
.card .memo{margin-top:8px;font-size:13px;color:var(--ink2);background:var(--bg);border-radius:12px;padding:8px 11px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;color:var(--muted);padding:30px 20px;line-height:1.9;font-weight:700}
.empty-mascot{height:96px;image-rendering:pixelated;margin-bottom:8px}
.face-mini{width:22px;height:22px;vertical-align:-5px;margin-right:4px}

/* 順番に出てくる・呼吸する・タップでぷるん */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .6s var(--out-cubic) both}
.stagger>*:nth-child(2){animation-delay:.06s}.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.24s}.stagger>*:nth-child(n+6){animation-delay:.3s}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
.breathe{animation:breathe 2.4s var(--inout-sine) infinite;transform-origin:50% 100%}
@keyframes jelly{0%{transform:scale(1,1)}25%{transform:scale(1.15,.85)}45%{transform:scale(.9,1.1)}62%{transform:scale(1.05,.95)}80%{transform:scale(.98,1.02)}100%{transform:scale(1,1)}}
.jelly{animation:jelly .76s var(--out-cubic);transform-origin:50% 100%}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .52s var(--out-back) both}

/* パネル(入力・詳細・メニュー) */
.backdrop{position:fixed;inset:0;background:rgba(45,50,70,.45);z-index:2000}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;z-index:2001;background:var(--bg);border-radius:26px 26px 0 0;border:2px solid var(--line);border-bottom:0;
  display:flex;flex-direction:column;padding-bottom:var(--safe-b);max-width:720px;margin:0 auto}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:2px dashed var(--line)}
.sheet header h2{font-size:17px;font-weight:700;margin:0;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet header button{border:0;background:none;color:var(--accent-text);font-weight:700;min-width:64px;padding:6px}
.sheet header button.r{background:var(--accent);color:var(--on-accent);border-radius:12px;box-shadow:0 3px 0 var(--accent-deep);min-width:56px;padding:6px 12px}
.sheet header button.r:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-deep)}
.sheet .content{overflow:auto;padding:16px;-webkit-overflow-scrolling:touch}
/* 詳細カード：画面中央に浮かぶカードとしてポップ表示 */
.popwrap{position:fixed;z-index:2001;top:calc(var(--safe-t) + 16px);bottom:calc(var(--safe-b) + 16px);left:12px;right:12px;
  display:flex;align-items:center;justify-content:center;pointer-events:none}
.sheet.pop{position:relative;left:auto;right:auto;bottom:auto;width:100%;max-height:100%;border-radius:26px;border-bottom:2px solid var(--line);padding-bottom:0;
  pointer-events:auto;box-shadow:0 6px 0 var(--edge),0 18px 40px rgba(0,0,0,.25);will-change:transform,opacity;animation:none}
.sheet header .mascot{width:64px;display:flex;justify-content:flex-end}
.sheet header .mascot img{height:46px;width:auto;image-rendering:pixelated;margin:-10px 2px -6px 0;transform-origin:50% 100%}
.closing{pointer-events:none}
.closing *{pointer-events:none!important}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 4px 6px;font-weight:700}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:14px;background:var(--track) center/cover no-repeat;border:2px solid var(--line)}
.photos .ph .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:14px;border:0;background:rgba(45,50,70,.7);color:#fff;padding:0;display:flex;align-items:center;justify-content:center}
.photos .ph .x .i{width:14px;height:14px}
.photos .add{aspect-ratio:1;border-radius:14px;border:2px dashed var(--faint);display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--surface)}
.photos .add .i{width:28px;height:28px;color:var(--accent)}
.dhead{margin-bottom:12px}
.dhead .name{font-size:22px;font-weight:700;line-height:1.4}
.dhead .addr{color:var(--muted);font-size:13px;margin-top:3px}
.dhead .meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.row{display:flex;gap:10px;margin:14px 0}
.row .btn{flex:1}
.visit{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:12px;box-shadow:0 4px 0 var(--edge)}
.visit .vh{display:flex;justify-content:space-between;align-items:center}
.visit .vh b{font-family:Fredoka,"Zen Maru Gothic",sans-serif;font-weight:600;font-size:16px}
.visit .vh button{border:0;background:var(--track);color:var(--ink2);font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;margin-left:6px}
.visit .vd{margin-top:8px;font-size:15px;font-weight:700}
.visit .vm{margin-top:8px;font-size:14px;color:var(--ink2);white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:8px 11px}
.visit .photos{margin-top:10px}
.sec{font-size:13px;font-weight:700;color:var(--muted);margin:20px 4px 10px}
.viewer{position:fixed;inset:0;z-index:4000;background:#000;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.menu .btn{margin-bottom:12px}
.menu .sec:first-child{margin-top:0}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg3 .pill{justify-content:center}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
.sw{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:9px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:12px;font-weight:700;color:var(--ink2);box-shadow:0 3px 0 var(--edge)}
.sw i{width:30px;height:30px;border-radius:50%;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.sw.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-text)}
.share-prev{display:block;width:100%;border-radius:18px;border:2px solid var(--line);box-shadow:0 4px 0 var(--edge);background:var(--surface)}
.toggles{display:flex;gap:18px;flex-wrap:wrap;margin:14px 4px}
.toggles label{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--ink2)}
.toggles input{width:22px;height:22px;padding:0;margin:0;box-shadow:none;accent-color:var(--accent)}
.visit .vh button.sh{background:var(--accent-weak);color:var(--accent-text)}
.note{font-size:13px;color:var(--muted);line-height:1.8}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
'use strict';
const API = 'https://api.openpoiapi.com/v1';
const RAMEN_Q = 'ラーメン らーめん 拉麺 中華そば つけ麺 らあめん';

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('ramen-log', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('shops', { keyPath: 'id' });
        d.createObjectStore('photos', { keyPath: 'id' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode);
      const out = fn(t.objectStore(store));
      t.oncomplete = () => res(out && 'result' in out ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  get(store, id) { return this.tx(store, 'readonly', s => s.get(id)); },
  put(store, v) { return this.tx(store, 'readwrite', s => { s.put(v); }); },
  del(store, id) { return this.tx(store, 'readwrite', s => { s.delete(id); }); },
};

/* ---------- 状態 ---------- */
let shops = [];               // 来訪済みの店
const photoUrls = new Map();  // photoId -> objectURL
let map, visitedLayer, candLayer;

const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDate = s => { if (!s) return '—'; const [y, m, d] = s.split('-'); return `${y}/${+m}/${+d}`; };
const norm = s => String(s ?? '').normalize('NFKC');
const poiId = p => `poi:${p.name}@${(+p.lat).toFixed(5)},${(+p.lng).toFixed(5)}`;
const lastVisit = s => s.visits.reduce((a, v) => (v.date > a ? v.date : a), '');
const sortedVisits = s => [...s.visits].sort((a, b) => b.date.localeCompare(a.date) || b.createdAt - a.createdAt);
const findShop = id => shops.find(s => s.id === id);

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

async function photoUrl(id) {
  if (photoUrls.has(id)) return photoUrls.get(id);
  const rec = await DB.get('photos', id);
  if (!rec) return '';
  const url = URL.createObjectURL(rec.blob);
  photoUrls.set(id, url);
  return url;
}

/* 写真を長辺1600pxに縮小してJPEG化 */
async function resizeImage(file) {
  const bmp = await createImageBitmap(file);
  const max = 1600, k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  bmp.close && bmp.close();
  return new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
}

/* ---------- 地図 ---------- */
function initMap() {
  map = L.map('map', { zoomControl: false, tapHold: true }).setView([35.6812, 139.7671], 14);
  L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a> | 店舗: <a href="https://openpoiapi.com/attribution.html" target="_blank">OpenPOI API</a>',
  }).addTo(map);
  candLayer = L.layerGroup().addTo(map);
  visitedLayer = L.layerGroup().addTo(map);

  // 長押しで手動登録
  map.on('contextmenu', e => manualAdd(e.latlng));

  const saved = (() => { try { return JSON.parse(localStorage.getItem('lastView')); } catch { return null; } })();
  if (saved) map.setView([saved.lat, saved.lng], saved.z);
  else if (shops.length) map.fitBounds(L.latLngBounds(shops.map(s => [s.lat, s.lng])).pad(0.2), { maxZoom: 15 });
  map.on('moveend', () => {
    const c = map.getCenter();
    try { localStorage.setItem('lastView', JSON.stringify({ lat: c.lat, lng: c.lng, z: map.getZoom() })); } catch {}
  });
}

function pinIcon(visited, count) {
  return L.divIcon({
    className: '',
    html: visited
      ? `<div class="pin visited">${count > 1 ? `<span class="cnt">${count}</span>` : ''}</div>`
      : `<div class="pin cand"><svg class="i" aria-hidden="true"><use href="#i-bowl-steam-fill"/></svg></div>`,
    iconSize: visited ? [40, 40] : [26, 26],
    iconAnchor: visited ? [20, 20] : [13, 13],
    popupAnchor: [0, visited ? -18 : -12],
  });
}

function renderVisitedPins() {
  visitedLayer.clearLayers();
  for (const s of shops) {
    const m = L.marker([s.lat, s.lng], { icon: pinIcon(true, s.visits.length), zIndexOffset: 1000 });
    m.bindPopup(() => {
      const el = document.createElement('div');
      el.innerHTML = `<b>${esc(s.name)}</b><div class="pop-addr">${esc(s.address)}</div>
        <div style="margin-top:6px">最終来訪 ${fmtDate(lastVisit(s))}・${s.visits.length}回</div>
        <button class="btn">記録を見る</button>`;
      el.querySelector('button').onclick = e => { map.closePopup(); openDetail(s.id, { x: e.clientX, y: e.clientY }); };
      return el;
    });
    visitedLayer.addLayer(m);
  }
}

function showCandidates(list) {
  candLayer.clearLayers();
  for (const p of list) {
    const id = poiId(p);
    if (findShop(id)) continue; // 来訪済みはキャラの顔ピンで表示済み
    const m = L.marker([p.lat, p.lng], { icon: pinIcon(false) });
    m.bindPopup(() => candidatePopup(p));
    m.poiId = id;
    candLayer.addLayer(m);
  }
}

function candidatePopup(p) {
  const el = document.createElement('div');
  el.innerHTML = `<b>${esc(norm(p.name))}</b><div class="pop-addr">${esc(norm(p.address))}</div>
    <button class="btn"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>来訪を記録</button>`;
  el.querySelector('button').onclick = () => {
    map.closePopup();
    openVisitForm({ id: poiId(p), name: norm(p.name), address: norm(p.address), lat: +p.lat, lng: +p.lng, source: 'openpoi' });
  };
  return el;
}

async function apiSearch(params) {
  const u = new URL(API + '/search');
  Object.entries(params).forEach(([k, v]) => u.searchParams.set(k, v));
  const r = await fetch(u);
  if (r.status === 429) throw new Error('アクセスが混み合っています。少し待ってから再試行してください');
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || '検索に失敗しました');
  return j.results || [];
}

const bboxStr = b => [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map(n => n.toFixed(6)).join(',');

async function searchArea() {
  if (map.getZoom() < 12) { toast('もう少し地図を拡大してください'); return; }
  try {
    const list = await apiSearch({ q: RAMEN_Q, bbox: bboxStr(map.getBounds()), limit: 200 });
    showCandidates(list);
    toast(list.length ? `${list.length}件見つかりました（灰色のピン）` : 'この範囲では見つかりませんでした');
  } catch (e) { toast(e.message); }
}

async function searchKeyword(q) {
  const box = document.getElementById('results');
  if (!q) { box.classList.add('hidden'); searchArea(); return; }
  box.classList.remove('hidden');
  box.innerHTML = '<div class="foot">検索中…</div>';
  try {
    const c = map.getCenter();
    const list = await apiSearch({ q, center: `${c.lng.toFixed(6)},${c.lat.toFixed(6)}`, radius: 50000, limit: 30 });
    box.innerHTML = list.map((p, i) => `<div class="item" data-i="${i}"><b>${findShop(poiId(p)) ? '<img class="face-mini" src="face.svg" alt="来訪済み">' : ''}${esc(norm(p.name))}</b><small>${esc(norm(p.address))}</small></div>`).join('')
      + `<div class="foot"><span>${list.length ? '' : '見つかりませんでした。'}見つからない店は地図を長押しで登録</span><button class="btn sub" id="closeRes">閉じる</button></div>`;
    box.querySelectorAll('.item').forEach(el => el.onclick = e => {
      const p = list[+el.dataset.i];
      box.classList.add('hidden');
      document.getElementById('q').blur();
      showCandidates(list);
      map.setView([p.lat, p.lng], 17);
      const id = poiId(p);
      if (findShop(id)) { openDetail(id, { x: e.clientX, y: e.clientY }); return; }
      candLayer.eachLayer(m => { if (m.poiId === id) m.openPopup(); });
    });
    box.querySelector('#closeRes').onclick = () => box.classList.add('hidden');
  } catch (e) { box.innerHTML = `<div class="foot">${esc(e.message)}</div>`; }
}

function locate() {
  if (!navigator.geolocation) { toast('位置情報が使えません'); return; }
  navigator.geolocation.getCurrentPosition(
    p => { map.setView([p.coords.latitude, p.coords.longitude], 16); searchArea(); },
    () => toast('位置情報を取得できませんでした。設定で許可してください'),
    { enableHighAccuracy: true, timeout: 10000 });
}

function manualAdd(latlng) {
  const name = prompt('地図に載っていない店を登録します。\n店名を入力してください');
  if (!name || !name.trim()) return;
  openVisitForm({ id: 'm:' + uid(), name: name.trim(), address: '', lat: latlng.lat, lng: latlng.lng, source: 'manual' });
}

/* ---------- シート（下から出るパネル） ---------- */
/* ポップスケール：scale 0.05 → 1.08 → 1（520ms・easeOutBack相当）
   参考 motion-reference.takayustudio.jp の値は最大1.16。画面いっぱいのカードでは端がはみ出すため控えめにしている */
const POP_PEAK = 1.08;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function popIn(wrap, origin) {
  if (reduceMotion.matches) return;
  const sheet = wrap.querySelector('.sheet');
  const r = sheet.getBoundingClientRect();
  const ox = origin ? origin.x - r.left : r.width / 2;
  const oy = origin ? origin.y - r.top : r.height / 2;
  sheet.style.transformOrigin = `${ox}px ${oy}px`;
  sheet.animate([
    { transform: 'scale(.05)', easing: 'cubic-bezier(.22,.61,.36,1)' },
    { transform: `scale(${POP_PEAK})`, offset: 0.72, easing: 'cubic-bezier(.45,0,.55,1)' },
    { transform: 'scale(1)' },
  ], { duration: 520 });
  sheet.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120 });
  wrap.querySelector('.backdrop').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 220 });
}

function popOut(wrap) {
  wrap.classList.add('closing');
  if (reduceMotion.matches) { wrap.remove(); return; }
  const a = wrap.querySelector('.sheet').animate(
    [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(.92)', opacity: 0 }],
    { duration: 180, easing: 'cubic-bezier(.32,0,.67,0)', fill: 'forwards' });
  wrap.querySelector('.backdrop').animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' });
  a.onfinish = () => wrap.remove();
}

function openSheet({ title, left, right, onRight, body, pop, mascot }) {
  const root = document.getElementById('sheetRoot');
  const wrap = document.createElement('div');
  const sheetHtml = `<div class="sheet${pop ? ' pop' : ''}"><header><button class="l">${left || '閉じる'}</button><h2>${esc(title)}</h2><button class="r">${right || ''}</button></header>
    <div class="content"></div></div>`;
  wrap.innerHTML = `<div class="backdrop"></div>` + (pop ? `<div class="popwrap">${sheetHtml}</div>` : sheetHtml);
  const close = () => { if (pop) popOut(wrap); else wrap.remove(); };
  wrap.querySelector('.backdrop').onclick = close;
  wrap.querySelector('.l').onclick = close;
  const r = wrap.querySelector('.r');
  if (onRight) r.onclick = () => onRight(close);
  else if (mascot) r.outerHTML = '<span class="mascot"><img src="mascot.svg" alt=""></span>';
  else r.style.visibility = 'hidden';
  const content = wrap.querySelector('.content');
  if (typeof body === 'string') content.innerHTML = body; else content.appendChild(body);
  root.appendChild(wrap);
  if (pop) popIn(wrap, pop.x != null ? pop : null);
  if (mascot && pop && !reduceMotion.matches) {
    // キャラはカードより少し遅れて、足元を軸にポンと出る
    wrap.querySelector('.mascot img').animate([
      { transform: 'scale(0)', offset: 0 },
      { transform: 'scale(0)', offset: 0.4, easing: 'cubic-bezier(.22,.61,.36,1)' },
      { transform: 'scale(1.16)', offset: 0.8, easing: 'cubic-bezier(.45,0,.55,1)' },
      { transform: 'scale(1)' },
    ], { duration: 700 });
  }
  return { close, content };
}

function viewPhoto(url) {
  const v = document.createElement('div');
  v.className = 'viewer';
  v.innerHTML = `<img src="${url}">`;
  v.onclick = () => v.remove();
  document.body.appendChild(v);
}

/* 来訪の追加・編集フォーム */
async function openVisitForm(shopInfo, visit) {
  const editing = !!visit;
  const v = visit ? { ...visit, photos: [...visit.photos] } : { id: uid(), date: today(), dishes: '', memo: '', photos: [], createdAt: Date.now() };
  const newPhotos = []; // 今回追加した写真ID（キャンセル時に削除）
  const body = document.createElement('div');
  body.innerHTML = `
    <div class="dhead"><div class="name">${esc(shopInfo.name)}</div><div class="addr">${esc(shopInfo.address)}</div></div>
    <div class="field"><label>訪れた日</label><input type="date" id="fDate" value="${esc(v.date)}"></div>
    <div class="field"><label>食べたもの</label><input id="fDish" placeholder="例：特製醤油らーめん、味玉、半チャーハン" value="${esc(v.dishes)}"></div>
    <div class="field"><label>メモ</label><textarea id="fMemo" placeholder="味の感想、混み具合、次に頼みたいもの など">${esc(v.memo)}</textarea></div>
    <div class="field"><label>写真</label><div class="photos" id="fPhotos"></div></div>`;
  const grid = body.querySelector('#fPhotos');

  async function drawPhotos() {
    const urls = await Promise.all(v.photos.map(photoUrl));
    grid.innerHTML = v.photos.map((id, i) => `<div class="ph" style="background-image:url('${urls[i]}')"><button class="x" data-i="${i}" aria-label="写真を外す"><svg class="i" aria-hidden="true"><use href="#i-x"/></svg></button></div>`).join('')
      + `<button class="add" type="button"><svg class="i" aria-hidden="true"><use href="#i-camera"/></svg>写真を追加</button>`;
    grid.querySelectorAll('.x').forEach(b => b.onclick = () => { v.photos.splice(+b.dataset.i, 1); drawPhotos(); });
    grid.querySelector('.add').onclick = () => {
      const fi = document.getElementById('fileInput');
      fi.value = '';
      fi.onchange = async () => {
        for (const f of fi.files) {
          try {
            const blob = await resizeImage(f);
            const id = uid();
            await DB.put('photos', { id, blob });
            v.photos.push(id); newPhotos.push(id);
          } catch { toast('写真を読み込めませんでした'); }
        }
        drawPhotos();
      };
      fi.click();
    };
  }
  drawPhotos();

  const sheet = openSheet({
    title: editing ? '来訪を編集' : '来訪を記録', left: 'キャンセル', right: '保存', body,
    onRight: async close => {
      v.date = body.querySelector('#fDate').value || today();
      v.dishes = body.querySelector('#fDish').value.trim();
      v.memo = body.querySelector('#fMemo').value.trim();
      let shop = findShop(shopInfo.id);
      if (!shop) { shop = { ...shopInfo, visits: [], createdAt: Date.now() }; shops.push(shop); }
      const removed = editing ? visit.photos.filter(id => !v.photos.includes(id)) : [];
      const i = shop.visits.findIndex(x => x.id === v.id);
      if (i >= 0) shop.visits[i] = v; else shop.visits.push(v);
      await DB.put('shops', shop);
      for (const id of removed) await DB.del('photos', id);
      newPhotos.length = 0;
      close();
      refreshAll();
      toast('保存しました');
      if (!document.querySelector('#sheetRoot > div:not(.closing) .sheet')) openDetail(shop.id);
    },
  });
  // キャンセル時は追加した写真を破棄
  const cancel = async () => { for (const id of newPhotos) await DB.del('photos', id); sheet.close(); };
  const wrap = sheet.content.closest('.sheet').parentElement;
  wrap.querySelector('.l').onclick = cancel;
  wrap.querySelector('.backdrop').onclick = cancel;
}

/* 店の詳細 */
// origin: ポップの起点（タップした位置）。false なら動きなしで表示
async function openDetail(id, origin = true) {
  const s = findShop(id);
  if (!s) return;
  document.querySelectorAll('#sheetRoot > div').forEach(e => e.remove());
  const visits = sortedVisits(s);
  const allUrls = new Map();
  for (const v of visits) for (const p of v.photos) allUrls.set(p, await photoUrl(p));

  const body = document.createElement('div');
  body.innerHTML = `
    <div class="dhead"><div class="name">${esc(s.name)}</div><div class="addr">${esc(s.address || (s.source === 'manual' ? '手動登録' : ''))}</div>
      <div class="meta"><span class="chip">最終来訪 ${fmtDate(lastVisit(s))}</span><span class="chip gray">来訪 ${s.visits.length}回</span></div></div>
    <div class="row"><button class="btn" id="dAdd"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg>来訪を追加</button><button class="btn sub" id="dMap"><svg class="i" aria-hidden="true"><use href="#i-map-trifold"/></svg>地図</button></div>
    <button class="btn sub block" id="dShare"><svg class="i" aria-hidden="true"><use href="#i-export"/></svg>カードを画像にしてシェア</button>
    <div class="sec">来訪の記録</div>
    ${visits.map(v => `<div class="visit" data-id="${v.id}">
      <div class="vh"><b>${fmtDate(v.date)}</b><span><button class="sh">シェア</button><button class="ed">編集</button><button class="dl">削除</button></span></div>
      ${v.dishes ? `<div class="vd"><svg class="i" aria-hidden="true"><use href="#i-bowl-food"/></svg>${esc(v.dishes)}</div>` : ''}
      ${v.memo ? `<div class="vm">${esc(v.memo)}</div>` : ''}
      ${v.photos.length ? `<div class="photos">${v.photos.map(p => `<div class="ph" data-p="${p}" style="background-image:url('${allUrls.get(p)}')"></div>`).join('')}</div>` : ''}
    </div>`).join('')}
    <div class="row" style="margin-top:24px"><button class="btn danger" id="dDel">このお店を削除</button></div>`;

  const sheet = openSheet({ title: s.name, body, pop: origin, mascot: true });
  body.querySelector('#dAdd').onclick = () => { sheet.close(); openVisitForm(s); };
  body.querySelector('#dShare').onclick = () => openShare(s, visits[0]);
  body.querySelector('#dMap').onclick = () => {
    sheet.close(); switchTab('mapView');
    map.setView([s.lat, s.lng], 17);
    visitedLayer.eachLayer(m => { const ll = m.getLatLng(); if (ll.lat === s.lat && ll.lng === s.lng) m.openPopup(); });
  };
  body.querySelectorAll('.ph[data-p]').forEach(el => el.onclick = () => viewPhoto(allUrls.get(el.dataset.p)));
  body.querySelectorAll('.visit').forEach(el => {
    const v = s.visits.find(x => x.id === el.dataset.id);
    el.querySelector('.sh').onclick = () => openShare(s, v);
    el.querySelector('.ed').onclick = () => { sheet.close(); openVisitForm(s, v); };
    el.querySelector('.dl').onclick = async () => {
      if (!confirm(`${fmtDate(v.date)} の記録を削除しますか？`)) return;
      s.visits = s.visits.filter(x => x !== v);
      for (const p of v.photos) await DB.del('photos', p);
      if (s.visits.length) { await DB.put('shops', s); refreshAll(); openDetail(s.id, false); }
      else { await removeShop(s); sheet.close(); }
    };
  });
  body.querySelector('#dDel').onclick = async () => {
    if (!confirm(`「${s.name}」と全ての来訪記録・写真を削除しますか？`)) return;
    for (const v of s.visits) for (const p of v.photos) await DB.del('photos', p);
    await removeShop(s); sheet.close();
  };
}

async function removeShop(s) {
  await DB.del('shops', s.id);
  shops = shops.filter(x => x !== s);
  refreshAll();
  toast('削除しました');
}

/* ---------- キャラクター(トークン使用量 Mod のドット絵)---------- */
// 1文字＝1ドット。表情は目のまわりのドットを書き換えて作る(Eureka! と同じ作り方)
const PAL = { a: '#db8c23', b: '#eda02e', c: '#2d3246', d: '#f5c67e', e: '#f7c7c3', f: '#a4a353', g: '#fdebe1', h: '#e7e668', i: '#f3a5b2',
  j: '#566c55', k: '#6c846a', l: '#4c6842', m: '#a7791b', n: '#acacac' };
const SPRITE = [
  '...a.........a....', '..aba.......aba...', '..abac.aaaaabba...', '..cbcaabbbbbbba...', '..acbbbbbbbbbaaa..',
  '.aabddbdddbbabaaa.', '.aabbabbbabbbbbaa.', '.aabaeabaeabbbbaaa', 'a.abefeaefeabbbbaa', '..aagfgggfggbbbaa.',
  '..aaghggghggbbbaa.', '...aigggggiibbaa..', '.a.aaajeejjabaaa.a', '..aaajkhhfkjaaaaa.', '....jklhhhfkjaa...',
  '...egllggellge....', '....ll.....llm....', '.....nnnnnnnmmm...', '......nenenmmmm.m.', '......nlnln...mm..', '......nn.nn.......',
];
const EYES = [5, 9];
const EXPR = {
  normal: [],
  blink: EYES.flatMap(x => [[x, 8, 'e'], [x, 9, 'c'], [x, 10, 'g']]),
  happy: EYES.flatMap(x => [[x, 8, 'e'], [x, 9, 'c'], [x, 10, 'g'], [x - 1, 10, 'c'], [x + 1, 10, 'c']]),
};
function spriteSvg(expr = 'normal') {
  const grid = SPRITE.map(r => r.split(''));
  for (const [x, y, c] of EXPR[expr] || []) grid[y][x] = c;
  let rects = '';
  grid.forEach((row, y) => row.forEach((c, x) => { if (c !== '.') rects += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`; }));
  return `<svg viewBox="0 0 18 21" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg>`;
}
function setExpr(el, expr) { if (el) { el.dataset.expr = expr; el.innerHTML = spriteSvg(expr); } }
// まばたき：ふだんの表情のときだけ、ときどき目を閉じる
setInterval(() => {
  document.querySelectorAll('.chara[data-expr="normal"]').forEach(el => {
    el.innerHTML = spriteSvg('blink');
    setTimeout(() => { if (el.dataset.expr === 'normal') el.innerHTML = spriteSvg('normal'); }, 150);
  });
}, 3400);
// アニメーションをもう一度再生する
function replay(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// 数字を 0 から目標までカウントアップする
function countUp(el, to) {
  if (reduceMotion.matches) { el.textContent = to; return; }
  const start = performance.now(), dur = 700;
  const step = t => {
    const p = Math.min(1, (t - start) / dur);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
const daysSince = d => Math.round((new Date(today()) - new Date(d)) / 86400000);
const agoLabel = n => (n <= 0 ? 'きょう' : n === 1 ? 'きのう' : `${n}日前`);

/* ---------- 来訪履歴の上の部分(キャラ・吹き出し・記録の数)---------- */
const TAP_LINES = ['ずるずる〜っ', '替え玉おねがいします！', 'スープまで飲む派？', 'のりは最後に食べる派なの', 'なるとって、うずまき…', 'きょうは何味の気分？'];
function heroLine() {
  if (!shops.length) return 'いっしょにラーメン探そ！';
  const m = monthCount();
  const latest = shops.reduce((a, s) => (lastVisit(s) > a ? lastVisit(s) : a), '');
  if (latest === today()) return 'きょうの一杯、どうだった？';
  if (m >= 3) return `今月は${m}杯！いいペース！`;
  if (m === 1) return '今月の1杯目、いいスタート！';
  if (m > 0) return `今月は${m}杯目まで来たね`;
  return pick(['次はどこ行く？', 'そろそろラーメンの気分…？', '行きたいお店、さがしてみよ！']);
}
function monthCount() {
  const ym = today().slice(0, 7);
  return shops.reduce((n, s) => n + s.visits.filter(v => v.date.startsWith(ym)).length, 0);
}
function renderHero(anim) {
  const mascotEl = document.getElementById('heroMascot');
  if (!mascotEl.dataset.expr) setExpr(mascotEl, 'normal');
  document.getElementById('heroTalk').textContent = heroLine();
  const vals = { stShops: shops.length, stBowls: shops.reduce((n, s) => n + s.visits.length, 0), stMonth: monthCount() };
  for (const [id, v] of Object.entries(vals)) {
    const el = document.getElementById(id);
    if (anim) countUp(el, v); else el.textContent = v;
  }
  if (anim) replay(document.querySelector('.hero-talk .bubble'), 'pop');
}
function tapMascot() {
  const el = document.getElementById('heroMascot');
  setExpr(el, 'happy'); replay(el, 'jelly');
  const talk = document.getElementById('heroTalk');
  talk.textContent = pick(TAP_LINES); replay(talk, 'pop');
  clearTimeout(tapMascot.t);
  tapMascot.t = setTimeout(() => setExpr(el, 'normal'), 1400);
}

/* ---------- 履歴カード ---------- */
let sortMode = 'last';
// anim: タブを開いたときだけカードを順番に出す(入力中は動かさない)
async function renderCards(anim = false) {
  const q = document.getElementById('filter').value.trim().toLowerCase();
  let list = shops.filter(s => !q || [s.name, s.address, ...s.visits.flatMap(v => [v.dishes, v.memo])].join(' ').toLowerCase().includes(q));
  list.sort(sortMode === 'count' ? (a, b) => b.visits.length - a.visits.length
    : sortMode === 'name' ? (a, b) => a.name.localeCompare(b.name, 'ja')
    : (a, b) => lastVisit(b).localeCompare(lastVisit(a)));
  renderHero(anim);

  const el = document.getElementById('cards');
  el.classList.toggle('stagger', !!anim);
  if (!shops.length) {
    el.innerHTML = `<div class="empty"><img class="empty-mascot" src="mascot.svg" alt=""><br>まだ記録がありません。<br>マップで近くのお店を探して、<br>灰色のピンから記録しましょう。</div>`;
    return;
  }
  const html = await Promise.all(list.map(async s => {
    const vs = sortedVisits(s), latest = vs[0], n = s.visits.length;
    const ph = vs.flatMap(v => v.photos)[0];
    const url = ph ? await photoUrl(ph) : '';
    const rank = n >= 5 ? '<span class="rank gold">常連さん</span>' : n >= 2 ? '<span class="rank">リピート</span>' : '';
    return `<div class="card" data-id="${esc(s.id)}">
      <div class="thumb${url ? '' : ' none'}" ${url ? `style="background-image:url('${url}')"` : ''}>${url ? '' : '<img class="thumb-mascot" src="mascot.svg" alt="">'}
        <span class="bowls"><svg class="i" aria-hidden="true"><use href="#i-bowl-steam-fill"/></svg><span class="num">${n}</span>杯</span>${rank}</div>
      <div class="body">
        <div class="name">${esc(s.name)}</div>
        <div class="area">${esc(s.address || '')}</div>
        <div class="meta"><span class="chip">最終来訪 <span class="num">${fmtDate(latest.date)}</span></span><span class="chip gray">${agoLabel(daysSince(latest.date))}</span></div>
        ${latest.dishes ? `<div class="dish"><svg class="i" aria-hidden="true"><use href="#i-bowl-food"/></svg>${esc(latest.dishes)}</div>` : ''}
        ${latest.memo ? `<div class="memo">${esc(latest.memo)}</div>` : ''}
      </div></div>`;
  }));
  el.innerHTML = html.join('') || '<div class="empty">該当するお店がありません</div>';
  el.querySelectorAll('.card').forEach(c => c.onclick = e => openDetail(c.dataset.id, { x: e.clientX, y: e.clientY }));
}

function refreshAll() { renderVisitedPins(); renderCards(); }

/* ---------- テーマ(明るさとメインの色)---------- */
const THEMES = [
  { id: 'miso', name: 'みそ', c: '#e07b22' },
  { id: 'shoyu', name: 'しょうゆ', c: '#8a5a3b' },
  { id: 'shio', name: 'しお', c: '#2f86b0' },
  { id: 'naruto', name: 'なると', c: '#d9607a' },
  { id: 'negi', name: 'ねぎ', c: '#5a9a48' },
];
function loadTheme() { try { return JSON.parse(localStorage.getItem('ramen-theme')) || {}; } catch { return {}; } }
function saveTheme(t) { try { localStorage.setItem('ramen-theme', JSON.stringify(t)); } catch {} }
// <html> に data-theme(light / dark)と data-color(色の名前)を付けると、CSS 側で色が入れ替わる
function applyTheme(t = loadTheme()) {
  const r = document.documentElement;
  if (t.mode === 'light' || t.mode === 'dark') r.dataset.theme = t.mode; else delete r.dataset.theme;
  if (t.color && t.color !== 'miso') r.dataset.color = t.color; else delete r.dataset.color;
  document.querySelector('meta[name="theme-color"]').content = getComputedStyle(r).getPropertyValue('--bg').trim();
}
function themeSection(body) {
  const t = loadTheme();
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="sec">画面の明るさ</div>
    <div class="seg3">${[['auto', '自動'], ['light', 'ライト'], ['dark', 'ダーク']].map(([k, n]) =>
      `<button class="pill${(t.mode || 'auto') === k ? ' on' : ''}" data-mode="${k}">${n}</button>`).join('')}</div>
    <div class="sec">テーマカラー</div>
    <div class="swatches">${THEMES.map(c =>
      `<button class="sw${(t.color || 'miso') === c.id ? ' on' : ''}" data-color="${c.id}"><i style="background:${c.c}"></i>${c.name}</button>`).join('')}</div>
    <p class="note">「自動」は iPhone のダークモードの設定に合わせます。</p>`;
  wrap.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    const cur = loadTheme(); cur.mode = b.dataset.mode; saveTheme(cur); applyTheme(cur);
    wrap.querySelectorAll('[data-mode]').forEach(x => x.classList.toggle('on', x === b));
  });
  wrap.querySelectorAll('[data-color]').forEach(b => b.onclick = () => {
    const cur = loadTheme(); cur.color = b.dataset.color; saveTheme(cur); applyTheme(cur);
    wrap.querySelectorAll('[data-color]').forEach(x => x.classList.toggle('on', x === b));
    replay(b, 'jelly');
  });
  body.prepend(wrap);
}

/* ---------- シェア画像(カードを画像にして SNS などに共有)---------- */
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
// 決めた幅に収まるように行を分ける。入りきらない分は「…」にする
function wrapLines(g, text, maxW, maxLines) {
  const lines = []; let cur = '';
  for (const ch of String(text).replace(/\s*\n\s*/g, ' ')) {
    if (g.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; if (lines.length === maxLines) break; }
    else cur += ch;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  else if (lines.length === maxLines && cur) {
    let last = lines[maxLines - 1];
    while (last && g.measureText(last + '…').width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last + '…';
  }
  return lines;
}
function drawSprite(g, x, y, px, expr = 'happy') {
  const grid = SPRITE.map(r => r.split(''));
  for (const [ex, ey, c] of EXPR[expr] || []) grid[ey][ex] = c;
  grid.forEach((row, ry) => row.forEach((c, rx) => { if (c !== '.') { g.fillStyle = PAL[c]; g.fillRect(x + rx * px, y + ry * px, px + .5, px + .5); } }));
}
function drawIcon(g, id, x, y, size, color) {
  const d = document.querySelector(`#${id} path`).getAttribute('d');
  g.save(); g.translate(x, y); g.scale(size / 256, size / 256); g.fillStyle = color; g.fill(new Path2D(d)); g.restore();
}
const loadImage = url => new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = url; });

async function makeShareImage(s, v, opt) {
  const W = 1080, H = 1350, F = '"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif', N = 'Fredoka,"Zen Maru Gothic",sans-serif';
  const C = { bg: cssVar('--bg'), dot: cssVar('--bg-dot'), surface: cssVar('--surface'), text: cssVar('--text'), muted: cssVar('--muted'), line: cssVar('--line'),
    edge: cssVar('--edge'), accent: cssVar('--accent'), deep: cssVar('--accent-deep'), weak: cssVar('--accent-weak'), atext: cssVar('--accent-text'), negi: cssVar('--negi'), negiDeep: cssVar('--negi-deep') };
  const order = [...s.visits].sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt);
  const nth = order.indexOf(v) + 1;
  const texts = [s.name, s.address, v.dishes, v.memo, fmtDate(v.date), 'ラーメン帳杯目来訪リピート常連さん'].join('');
  await Promise.all([document.fonts.load(`700 60px ${F}`, texts), document.fonts.load(`500 32px ${F}`, texts), document.fonts.load(`600 40px ${N}`, '0123456789/')]).catch(() => {});

  // 中身は透明な下書きに描き、最後に中身の高さに合わせてカードと背景を作る
  const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
  const g = layer.getContext('2d');
  const cx = 60, cy = 56, cw = 960;
  // 写真
  const px = 92, py = 88, pw = 896, ph = 580;
  g.save(); rrect(g, px, py, pw, ph, 36); g.clip();
  const photoId = v.photos[0] || sortedVisits(s).flatMap(x => x.photos)[0];
  if (photoId) {
    const im = await loadImage(await photoUrl(photoId));
    const k = Math.max(pw / im.width, ph / im.height);
    g.drawImage(im, px + (pw - im.width * k) / 2, py + (ph - im.height * k) / 2, im.width * k, im.height * k);
  } else {
    g.fillStyle = C.weak; g.fillRect(px, py, pw, ph);
    drawSprite(g, px + pw / 2 - 18 * 11 / 2, py + 80, 11, 'happy');
  }
  g.restore();
  // 「◯杯目」と「リピート/常連さん」の札
  g.font = `700 34px ${F}`;
  const label = `${nth}杯目`, lw = g.measureText(label).width + 96;
  g.fillStyle = 'rgba(0,0,0,.14)'; rrect(g, px + 22, py + 26, lw, 66, 33); g.fill();
  g.fillStyle = '#fff'; rrect(g, px + 22, py + 22, lw, 66, 33); g.fill();
  drawIcon(g, 'i-bowl-steam-fill', px + 40, py + 33, 44, C.accent);
  g.fillStyle = C.accent; g.textBaseline = 'middle'; g.fillText(label, px + 92, py + 56);
  const n = s.visits.length;
  if (n >= 2) {
    const tag = n >= 5 ? '常連さん' : 'リピート', tw = g.measureText(tag).width + 48, gold = n >= 5;
    g.fillStyle = gold ? C.deep : C.negiDeep; rrect(g, px + pw - 22 - tw, py + 28, tw, 62, 31); g.fill();
    g.fillStyle = gold ? C.accent : C.negi; rrect(g, px + pw - 22 - tw, py + 22, tw, 62, 31); g.fill();
    g.fillStyle = '#fff'; g.fillText(tag, px + pw - 22 - tw + 24, py + 54);
  }
  // 店名・住所・日付
  let y = py + ph + 72;
  g.textBaseline = 'alphabetic'; g.fillStyle = C.text;
  let fs = 62; g.font = `700 ${fs}px ${F}`;
  while (g.measureText(s.name).width > 880 && fs > 40) { fs -= 2; g.font = `700 ${fs}px ${F}`; }
  g.fillText(wrapLines(g, s.name, 880, 1)[0], 100, y);
  y += 48;
  if (opt.address && s.address) { g.font = `500 30px ${F}`; g.fillStyle = C.muted; g.fillText(wrapLines(g, s.address, 880, 1)[0], 102, y); y += 26; }
  y += 22;
  g.font = `700 32px ${F}`;
  const dl = `${fmtDate(v.date)} 来訪`, dw = g.measureText(dl).width + 48;
  g.fillStyle = C.weak; rrect(g, 98, y, dw, 58, 29); g.fill();
  g.fillStyle = C.atext; g.textBaseline = 'middle'; g.fillText(dl, 122, y + 30);
  y += 116; g.textBaseline = 'alphabetic';
  // 食べたもの
  if (v.dishes) {
    g.font = `700 42px ${F}`;
    const ls = wrapLines(g, v.dishes, 820, 2);
    drawIcon(g, 'i-bowl-food', 98, y - 38, 48, C.accent);
    g.fillStyle = C.text; ls.forEach((l, i) => g.fillText(l, 162, y + i * 58));
    y += ls.length * 58 + 18;
  }
  // メモ
  if (opt.memo && v.memo) {
    g.font = `500 32px ${F}`;
    const ls = wrapLines(g, v.memo, 820, 4);
    const mh = ls.length * 48 + 34;
    g.fillStyle = C.bg; rrect(g, 98, y - 8, 884, mh, 24); g.fill();
    g.fillStyle = C.text; ls.forEach((l, i) => g.fillText(l, 128, y + 38 + i * 48));
    y += mh;
  }
  // 仕上げ：背景(ドット柄)とカード(下に影を付けた立体の板)を中身の高さで作り、中身を重ねる
  const ch = Math.max(y, py + ph + 260) + 28 - cy, FH = cy + ch + 12 + 56;
  const c = document.createElement('canvas'); c.width = W; c.height = FH;
  const f = c.getContext('2d');
  f.fillStyle = C.bg; f.fillRect(0, 0, W, FH);
  f.fillStyle = C.dot;
  for (let dy = 18; dy < FH; dy += 44) for (let dx = 18; dx < W; dx += 44) { f.beginPath(); f.arc(dx, dy, 3.4, 0, 7); f.fill(); }
  f.fillStyle = C.edge; rrect(f, cx, cy + 12, cw, ch, 52); f.fill();
  f.fillStyle = C.surface; rrect(f, cx, cy, cw, ch, 52); f.fill();
  f.lineWidth = 5; f.strokeStyle = C.line; rrect(f, cx, cy, cw, ch, 52); f.stroke();
  f.drawImage(layer, 0, 0);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

async function openShare(s, v) {
  const opt = { memo: true, address: true };
  const body = document.createElement('div');
  body.innerHTML = `
    <img class="share-prev" alt="シェア画像のプレビュー">
    <div class="toggles">
      <label><input type="checkbox" id="shMemo" checked>メモも入れる</label>
      <label><input type="checkbox" id="shAddr" checked>住所も入れる</label>
    </div>
    <button class="btn block" id="shGo"><svg class="i" aria-hidden="true"><use href="#i-export"/></svg>共有・保存する</button>
    <p class="note">共有メニューの「画像を保存」で写真アプリに保存できます。SNS のアプリを選ぶと、そのまま投稿できます。</p>`;
  const sh = openSheet({ title: 'シェア画像', body });
  const img = body.querySelector('.share-prev');
  let blob = null;
  const redraw = async () => {
    blob = await makeShareImage(s, v, opt);
    if (img.src) URL.revokeObjectURL(img.src);
    img.src = URL.createObjectURL(blob);
  };
  body.querySelector('#shMemo').onchange = e => { opt.memo = e.target.checked; redraw(); };
  body.querySelector('#shAddr').onchange = e => { opt.address = e.target.checked; redraw(); };
  body.querySelector('#shGo').onclick = async () => {
    if (!blob) return;
    const file = new File([blob], `ramen-${v.date}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== 'AbortError') toast('共有できませんでした'); }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('画像を保存しました');
  };
  await redraw();
  return sh;
}

/* ---------- バックアップ ---------- */
const blobToDataUrl = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

async function exportData() {
  toast('バックアップを作成中…');
  const photos = {};
  for (const rec of await DB.all('photos')) photos[rec.id] = await blobToDataUrl(rec.blob);
  const json = JSON.stringify({ app: 'ramen-log', version: 1, exportedAt: new Date().toISOString(), shops, photos });
  const name = `ramen-log-${today()}.json`;
  const file = new File([json], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'ramen-log') throw new Error();
    if (!confirm(`${data.shops.length}店の記録を読み込みます。同じ店の記録は上書きされます。よろしいですか？`)) return;
    for (const [id, url] of Object.entries(data.photos || {})) {
      const blob = await (await fetch(url)).blob();
      await DB.put('photos', { id, blob });
    }
    for (const s of data.shops) await DB.put('shops', s);
    shops = await DB.all('shops');
    refreshAll();
    toast('読み込みました');
  } catch { toast('バックアップファイルを読み込めませんでした'); }
}

function openMenu() {
  const body = document.createElement('div');
  body.className = 'menu';
  body.innerHTML = `
    <button class="btn block" id="mExp"><svg class="i" aria-hidden="true"><use href="#i-download-simple"/></svg>バックアップを書き出す</button>
    <button class="btn sub block" id="mImp"><svg class="i" aria-hidden="true"><use href="#i-upload-simple"/></svg>バックアップから復元</button>
    <p class="note">記録と写真はこのiPhoneの中だけに保存されます。機種変更やSafariのデータ削除に備えて、ときどきバックアップを「ファイル」アプリやiCloud Driveに保存してください。</p>
    <p class="note">地図: 国土地理院 ／ 店舗データ: <a href="https://openpoiapi.com/attribution.html" target="_blank">OpenPOI API</a>（Overture Maps Foundation ほか）</p>`;
  themeSection(body);
  const sh = openSheet({ title: 'メニュー', body });
  body.querySelector('#mExp').onclick = () => { sh.close(); exportData(); };
  body.querySelector('#mImp').onclick = () => {
    const fi = document.getElementById('importInput');
    fi.value = '';
    fi.onchange = () => { sh.close(); if (fi.files[0]) importData(fi.files[0]); };
    fi.click();
  };
}

/* ---------- タブ ---------- */
function switchTab(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('hidden', v.id !== id));
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  if (id === 'mapView') setTimeout(() => map.invalidateSize(), 0);
  if (id === 'listView') { document.getElementById('listView').scrollTop = 0; renderCards(true); }
}

/* ---------- 起動 ---------- */
(async () => {
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => applyTheme());
  await DB.open();
  shops = await DB.all('shops');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  initMap();
  refreshAll();

  document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.getElementById('searchForm').onsubmit = e => { e.preventDefault(); document.getElementById('q').blur(); searchKeyword(document.getElementById('q').value.trim()); };
  document.getElementById('btnArea').onclick = searchArea;
  document.getElementById('btnLocate').onclick = locate;
  document.getElementById('btnMenu').onclick = openMenu;
  document.getElementById('filter').oninput = () => renderCards();
  document.querySelectorAll('#sortSeg .pill').forEach(b => b.onclick = () => {
    sortMode = b.dataset.sort;
    document.querySelectorAll('#sortSeg .pill').forEach(x => x.classList.toggle('on', x === b));
    renderCards(true);
  });
  document.getElementById('heroMascot').onclick = tapMascot;

  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
